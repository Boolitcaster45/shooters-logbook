          {armsSub==='firearms' && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:13}}>
                <div style={stStyle}>REGISTERED FIREARMS</div>
                <button style={btnP} onClick={()=>{setEditFA(null);setShowFA(true);}}>+ Add</button>
              </div>
              {firearms.length===0 && <div style={{textAlign:'center',padding:'34px 18px',color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>NO FIREARMS REGISTERED</div>}
              {firearms.map(f => {
                const tot=rdsByFA[f.id]||0, yrR=rdsByFAYr[f.id]||0, isOpen=openFA===f.id;
                const hasDue=(f.pmcsSchedule||[]).some(p=>pmcsAlerts.find(a=>a.fId===f.id&&a.pId===p.id&&a.isDue));
                return (
                  <div key={f.id} style={{...cardStyle, ...(hasDue?{borderColor:`${G.accent}55`}:{})}}>
                    <div style={chStyle} onClick={()=>setOpenFA(isOpen?null:f.id)}>
                      <span style={{color:G.dim,fontSize:11}}>{isOpen?'▾':'▸'}</span>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:14,fontWeight:600,letterSpacing:1,color:G.text,flex:1}}>{f.make} {f.model}</div>
                          {hasDue && <span style={{fontSize:9,letterSpacing:1,color:G.accent,background:`${G.accent}20`,border:`1px solid ${G.accent}44`,padding:'2px 5px',borderRadius:2,textTransform:'uppercase',fontFamily:"'Oswald',sans-serif"}}>PMCS DUE</span>}
                        </div>
                        <div style={{fontSize:10,color:G.dim,marginTop:2,fontFamily:"'Share Tech Mono',monospace"}}>{f.type||'—'}{f.serial?` · SN: ${f.serial}`:''}</div>
                      </div>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.accent,background:`${G.accent}18`,padding:'3px 7px',border:`1px solid ${G.accent}33`,borderRadius:1,marginRight:4}}>{f.caliber}</span>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.muted}}>{tot.toLocaleString()} rds</span>
                    </div>
                    {isOpen && (
                      <div style={cbStyle}>
                        {/* Round count stats */}
                        <div style={fr}>
                          <div><div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:3}}>Rounds This Year</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:20,color:G.accent}}>{yrR.toLocaleString()}</div></div>
                          <div><div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:3}}>Lifetime Rounds</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:20,color:G.accent}}>{tot.toLocaleString()}</div></div>
                          <div><div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:3}}>Tracked Malfunctions</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:20,color:(malByFA[f.id]||0)>0?G.danger:G.dim}}>{malByFA[f.id]||0}</div></div>
                        </div>

                        {/* Suppressed breakdown — only shown if this gun has suppressed rounds */}
                        {(suppRdsByFA[f.id]||0) > 0 && (() => {
                          const suppLife = suppRdsByFA[f.id]||0;
                          const unsuppLife = tot - suppLife;
                          const suppYr = suppRdsByFAYr[f.id]||0;
                          const unsuppYr = yrR - suppYr;
                          const suppPct = tot > 0 ? Math.round((suppLife/tot)*100) : 0;
                          return (
                            <div style={{background:`${G.green}0d`, border:`1px solid ${G.green}2a`, borderLeft:`3px solid ${G.green}`, borderRadius:1, padding:'10px 12px', marginBottom:12}}>
                              <div style={{fontSize:10,letterSpacing:2,color:G.green,textTransform:'uppercase',marginBottom:8}}>Suppressed / Unsuppressed Split</div>
                              {/* Split bar */}
                              <div style={{display:'flex',height:8,borderRadius:4,overflow:'hidden',marginBottom:10}}>
                                <div style={{flex:suppLife,background:G.green,transition:'flex 0.4s ease'}}/>
                                <div style={{flex:unsuppLife,background:G.border}}/>
                              </div>
                              {/* Lifetime row */}
                              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:6}}>
                                <div>
                                  <div style={{fontSize:9,letterSpacing:1,color:G.green,textTransform:'uppercase',marginBottom:2}}>Suppressed</div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:16,color:G.green}}>{suppLife.toLocaleString()}</div>
                                  <div style={{fontSize:9,color:G.muted}}>lifetime</div>
                                </div>
                                <div>
                                  <div style={{fontSize:9,letterSpacing:1,color:G.muted,textTransform:'uppercase',marginBottom:2}}>Unsuppressed</div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:16,color:G.muted}}>{unsuppLife.toLocaleString()}</div>
                                  <div style={{fontSize:9,color:G.muted}}>lifetime</div>
                                </div>
                                <div style={{textAlign:'right'}}>
                                  <div style={{fontSize:9,letterSpacing:1,color:G.dim,textTransform:'uppercase',marginBottom:2}}>Suppressed</div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:16,color:G.green}}>{suppPct}%</div>
                                  <div style={{fontSize:9,color:G.muted}}>of lifetime rds</div>
                                </div>
                              </div>
                              {/* This year row */}
                              {yrR > 0 && (
                                <div style={{borderTop:`1px solid ${G.green}22`,paddingTop:6,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                                  <div>
                                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:14,color:G.green}}>{suppYr.toLocaleString()}</div>
                                    <div style={{fontSize:9,color:G.muted}}>suppressed {curYear()}</div>
                                  </div>
                                  <div>
                                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:14,color:G.muted}}>{unsuppYr.toLocaleString()}</div>
                                    <div style={{fontSize:9,color:G.muted}}>unsuppressed {curYear()}</div>
                                  </div>
                                  <div style={{textAlign:'right'}}>
                                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:14,color:G.green}}>{yrR>0?Math.round((suppYr/yrR)*100):0}%</div>
                                    <div style={{fontSize:9,color:G.muted}}>suppressed {curYear()}</div>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })()}
                        {(mrbsByFA[f.id]!==null || l1kByFA[f.id]!==null) && (
                          <div style={{margin:'11px 0',padding:'11px 13px',background:G.surface,border:`1px solid ${G.danger}33`,borderLeft:`3px solid ${G.danger}`,borderRadius:1}}>
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                              {mrbsByFA[f.id]!==null && (
                                <div style={{flex:1}}>
                                  <div style={{fontSize:9,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:2}}>Mean Rounds Between Stoppages</div>
                                  <div style={{fontSize:10,color:G.dim,fontStyle:'italic',marginBottom:4}}>{malByFA[f.id]} mal over {tot.toLocaleString()} rds</div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:mrbsByFA[f.id]>=1000?G.green:mrbsByFA[f.id]>=500?G.accent:G.danger,lineHeight:1}}>
                                    {mrbsByFA[f.id].toLocaleString()}<span style={{fontSize:10,color:G.dim,marginLeft:4}}>rds/stop</span>
                                  </div>
                                </div>
                              )}
                              {mrbsByFA[f.id]!==null && l1kByFA[f.id]!==null && <div style={{width:1,alignSelf:'stretch',background:G.border,flexShrink:0}}/>}
                              {l1kByFA[f.id]!==null && (
                                <div style={{flex:1,textAlign:mrbsByFA[f.id]!==null?'right':'left'}}>
                                  <div style={{fontSize:9,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:2}}>Last 1,000 Rounds</div>
                                  <div style={{fontSize:10,color:G.dim,fontStyle:'italic',marginBottom:4}}>Tracked stoppages</div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:l1kByFA[f.id]===0?G.green:l1kByFA[f.id]<=2?G.accent:G.danger,lineHeight:1}}>
                                    {l1kByFA[f.id]}<span style={{fontSize:10,color:G.dim,marginLeft:4}}>stoppage{l1kByFA[f.id]!==1?'s':''}</span>
                                  </div>
                                </div>
                              )}
                            </div>
                          </div>
                        )}
                        {(f.pmcsSchedule||[]).length>0 && (
                          <div style={{marginTop:11}}>
                            <div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:7}}>PMCS Schedule</div>
                            {(f.pmcsSchedule||[]).map(p => {
                              const al=pmcsAlerts.find(a=>a.fId===f.id&&a.pId===p.id);
                              if(!al) return null;
                              const {isDue,pct,since,left,interval}=al;
                              const bc=isDue?G.danger:pct>=80?G.accent:G.green;
                              return (
                                <div key={p.id} style={{background:G.bg,border:`1px solid ${isDue?G.danger+'55':G.border}`,borderLeft:`3px solid ${bc}`,borderRadius:1,padding:'9px 11px',marginBottom:7}}>
                                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5}}>
                                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:G.text,marginBottom:2}}>{p.task}</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.muted}}>Every {interval.toLocaleString()} rds · {since.toLocaleString()} since service</div></div>
                                    {isDue ? <button style={{...btnP,...btnSm,flexShrink:0,marginLeft:9}} onClick={()=>markSvc(f.id,p.id)}>Mark Serviced</button> : <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.muted,marginLeft:9,flexShrink:0}}>{left.toLocaleString()} rds left</span>}
                                  </div>
                                  <div style={barWrap}><div style={{height:'100%',width:`${pct}%`,background:bc,borderRadius:2,transition:'width 0.4s ease'}}/></div>
                                  {isDue && <div style={{fontFamily:"'Oswald',sans-serif",fontSize:10,letterSpacing:2,color:G.danger,textTransform:'uppercase',marginTop:4}}>⚙ SERVICE DUE</div>}
                                </div>
                              );
                            })}
                          </div>
                        )}
                        {f.notes && <div style={{fontSize:12,color:G.muted,marginTop:9}}>Notes: {f.notes}</div>}
                        <div style={{display:'flex',gap:7,marginTop:11}}>
                          <button style={{...btnG,...btnSm}} onClick={()=>{setEditFA(f);setShowFA(true);}}>Edit</button>
                          <button style={btnD} onClick={()=>delFA(f.id)}>Remove</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* ── Suppressors sub-tab ── */}
          {armsSub==='suppressors' && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:13}}>
                <div style={{...stStyle,borderBottomColor:G.green+'44',color:G.green}}>SUPPRESSORS / NFA ITEMS</div>
                <button style={{...btnP,background:G.green}} onClick={()=>{setEditSupp(null);setShowSupp(true);}}>+ Add</button>
              </div>
              {suppressors.length===0 && <div style={{textAlign:'center',padding:'34px 18px',color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>NO SUPPRESSORS REGISTERED</div>}
              {suppressors.map(s => {
                const tot=rdsBySupp[s.id]||0, yrR=rdsBySuppYr[s.id]||0, isOpen=openSupp===s.id;
                const hasDue=(s.pmcsSchedule||[]).some(p=>suppPmcsAlerts.find(a=>a.sId===s.id&&a.pId===p.id&&a.isDue));
                return (
                  <div key={s.id} style={{background:G.card,border:`1px solid ${hasDue?G.green+'55':G.border}`,borderLeft:`3px solid ${G.green}44`,borderRadius:2,marginBottom:9,overflow:'hidden'}}>
                    <div style={chStyle} onClick={()=>setOpenSupp(isOpen?null:s.id)}>
                      <span style={{color:G.dim,fontSize:11}}>{isOpen?'▾':'▸'}</span>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:14,fontWeight:600,letterSpacing:1,color:G.text,flex:1}}>{s.make} {s.model}</div>
                          {hasDue && <span style={{fontSize:9,letterSpacing:1,color:G.green,background:`${G.green}20`,border:`1px solid ${G.green}44`,padding:'2px 5px',borderRadius:2,textTransform:'uppercase',fontFamily:"'Oswald',sans-serif"}}>SERVICE DUE</span>}
                        </div>
                        <div style={{fontSize:10,color:G.dim,marginTop:2,fontFamily:"'Share Tech Mono',monospace"}}>
                          {s.mount||'—'}{s.serial?` · SN: ${s.serial}`:''}
                        </div>
                      </div>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.green,background:`${G.green}18`,padding:'3px 7px',border:`1px solid ${G.green}33`,borderRadius:1,marginRight:4}}>{s.caliber||'—'}</span>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.muted}}>{tot.toLocaleString()} rds</span>
                    </div>
                    {isOpen && (
                      <div style={cbStyle}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:9}}>
                          <div><div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:3}}>Rounds This Year</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:20,color:G.green}}>{yrR.toLocaleString()}</div></div>
                          <div><div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:3}}>Lifetime Rounds</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:20,color:G.green}}>{tot.toLocaleString()}</div></div>
                        </div>

                        {/* Suppressor details */}
                        <div style={{background:G.bg,border:`1px solid ${G.border}`,borderRadius:1,padding:10,marginBottom:10}}>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                            {s.mount && <div><span style={{fontSize:10,color:G.dim,letterSpacing:1,textTransform:'uppercase'}}>Mount: </span><span style={{fontSize:12,color:G.muted}}>{s.mount}</span></div>}
                            {s.baffle && <div><span style={{fontSize:10,color:G.dim,letterSpacing:1,textTransform:'uppercase'}}>Baffle: </span><span style={{fontSize:12,color:G.muted}}>{s.baffle}</span></div>}
                            {s.serial && <div><span style={{fontSize:10,color:G.dim,letterSpacing:1,textTransform:'uppercase'}}>Serial: </span><span style={{fontSize:12,color:G.muted,fontFamily:"'Share Tech Mono',monospace"}}>{s.serial}</span></div>}
                            {s.nfaNum && <div><span style={{fontSize:10,color:G.dim,letterSpacing:1,textTransform:'uppercase'}}>NFA #: </span><span style={{fontSize:12,color:G.muted,fontFamily:"'Share Tech Mono',monospace"}}>{s.nfaNum}</span></div>}
                            {s.mfgDate && <div><span style={{fontSize:10,color:G.dim,letterSpacing:1,textTransform:'uppercase'}}>Approval Date: </span><span style={{fontSize:12,color:G.muted}}>{fmtDate(s.mfgDate)}</span></div>}
                          </div>
                        </div>

                        {/* Suppressor PMCS */}
                        {(s.pmcsSchedule||[]).length>0 && (
                          <div style={{marginTop:4}}>
                            <div style={{fontSize:10,letterSpacing:2,color:G.muted,textTransform:'uppercase',marginBottom:7}}>Service Schedule</div>
                            {(s.pmcsSchedule||[]).map(p => {
                              const al=suppPmcsAlerts.find(a=>a.sId===s.id&&a.pId===p.id);
                              if(!al) return null;
                              const {isDue,pct,since,left,interval}=al;
                              const bc=isDue?G.danger:pct>=80?G.accent:G.green;
                              return (
                                <div key={p.id} style={{background:G.bg,border:`1px solid ${isDue?G.danger+'55':G.border}`,borderLeft:`3px solid ${bc}`,borderRadius:1,padding:'9px 11px',marginBottom:7}}>
                                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5}}>
                                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:G.text,marginBottom:2}}>{p.task}</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.muted}}>Every {interval.toLocaleString()} rds · {since.toLocaleString()} since service</div></div>
                                    {isDue ? <button style={{...btnP,...btnSm,background:G.green,flexShrink:0,marginLeft:9}} onClick={()=>markSuppSvc(s.id,p.id)}>Mark Serviced</button> : <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.muted,marginLeft:9,flexShrink:0}}>{left.toLocaleString()} rds left</span>}
                                  </div>
                                  <div style={barWrap}><div style={{height:'100%',width:`${pct}%`,background:bc,borderRadius:2,transition:'width 0.4s ease'}}/></div>
                                  {isDue && <div style={{fontFamily:"'Oswald',sans-serif",fontSize:10,letterSpacing:2,color:G.danger,textTransform:'uppercase',marginTop:4}}>⚙ SERVICE DUE</div>}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {s.notes && <div style={{fontSize:12,color:G.muted,marginTop:9}}>Notes: {s.notes}</div>}
                        <div style={{display:'flex',gap:7,marginTop:11}}>
                          <button style={{...btnG,...btnSm}} onClick={()=>{setEditSupp(s);setShowSupp(true);}}>Edit</button>
                          <button style={btnD} onClick={()=>delSupp(s.id)}>Remove</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ════ STATISTICS ════ */}
      {tab==='stats' && (
        <div style={pgStyle}>
          {/* Sub-tabs */}
          <div style={{display:'flex',borderBottom:`1px solid ${G.border}`,marginBottom:16}}>
            {[['overview','Overview'],['firearms','By Firearm'],['positions','By Position'],['export','Export']].map(([k,l]) => (
              <button key={k} onClick={()=>setStatSub(k)} style={{fontFamily:"'Oswald',sans-serif",fontSize:11,letterSpacing:2,textTransform:'uppercase',padding:'9px 0',border:'none',background:'none',cursor:'pointer',color:statSub===k?G.accent:G.muted,borderBottom:`2px solid ${statSub===k?G.accent:'transparent'}`,marginBottom:-1,flex:1,transition:'color 0.15s'}}>
                {l}
              </button>
            ))}
          </div>

          {/* Overview */}
          {statSub==='overview' && (
            <div>
              <div style={stStyle}>OVERVIEW</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:9,marginBottom:18}}>
                {[
                  [lifeRds.toLocaleString(),'Lifetime Rds'],
                  [yrRds.toLocaleString(),`Rds ${curYear()}`],
                  [sessions.length,'Total Sessions'],
                  [yrSess,`Sessions ${curYear()}`],
                  [firearms.length,'Firearms'],
                  [yrSess>0?Math.round(yrRds/yrSess):0,'Avg Rds/Sess'],
                ].map(([n,l]) => (
                  <div key={l} style={scardStyle}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:G.accent,lineHeight:1,marginBottom:4}}>{n}</div>
                    <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:G.muted}}>{l}</div>
                  </div>
                ))}
              </div>
              {suppressors.length > 0 && (
                <div style={{marginBottom:18}}>
                  <div style={stStyle}>SUPPRESSED FIRE</div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:9}}>
                    <div style={{...scardStyle, borderColor:`${G.green}44`, borderLeft:`3px solid ${G.green}`}}>
                      <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:G.green,lineHeight:1,marginBottom:4}}>{suppRdsLife.toLocaleString()}</div>
                      <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:G.muted}}>Lifetime Suppressed</div>
                    </div>
                    <div style={{...scardStyle, borderColor:`${G.green}44`, borderLeft:`3px solid ${G.green}`}}>
                      <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:G.green,lineHeight:1,marginBottom:4}}>{suppRdsYr.toLocaleString()}</div>
                      <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:G.muted}}>Suppressed {curYear()}</div>
                    </div>
                    <div style={{...scardStyle, borderColor:`${G.green}44`, borderLeft:`3px solid ${G.green}`}}>
                      <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:G.green,lineHeight:1,marginBottom:4}}>
                        {lifeRds > 0 ? Math.round((suppRdsLife/lifeRds)*100) : 0}%
                      </div>
                      <div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:G.muted}}>Of All Rounds</div>
                    </div>
                  </div>
                </div>
              )}
              <div style={stStyle}>RECENT SESSIONS</div>
              <div style={{...cardStyle}}>
                <div style={{padding:0}}>
                  {sorted.slice(0,8).map((s,i) => {
                    const rds=s.gunEntries.reduce((a,g)=>a+(parseInt(g.rounds)||0),0);
                    return <div key={s.id} style={{display:'flex',alignItems:'center',padding:'9px 13px',borderBottom:i<7?`1px solid ${G.border}`:'none'}}>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.accent,width:83}}>{fmtDate(s.date)}</span>
                      <span style={{flex:1,fontSize:12,color:G.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.location||'—'}</span>
                      <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:G.text}}>{rds} rds</span>
                    </div>;
                  })}
                  {sessions.length===0 && <div style={{textAlign:'center',padding:18,color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>NO SESSIONS YET</div>}
                </div>
              </div>
            </div>
          )}

          {/* By Firearm */}
          {statSub==='firearms' && (
            <div>
              <div style={stStyle}>ROUND COUNT BY FIREARM</div>
              <div style={cardStyle}>
                <div style={{padding:13}}>
                  {firearms.length===0 && <div style={{textAlign:'center',padding:18,color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>NO FIREARMS</div>}
                  {firearms.map(f => {
                    const tot=rdsByFA[f.id]||0, pct=Math.round((tot/maxRds)*100);
                    return (
                      <div key={f.id} style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',alignItems:'center',gap:9,padding:'9px 0',borderBottom:`1px solid ${G.border}`}}>
                        <div>
                          <div style={{fontFamily:"'Oswald',sans-serif",fontSize:13,letterSpacing:1}}>{f.make} {f.model}</div>
                          <div style={{fontSize:10,color:G.muted,fontFamily:"'Share Tech Mono',monospace"}}>{f.caliber}</div>
                          <div style={barWrap}><div style={{height:'100%',width:`${pct}%`,background:G.accent,borderRadius:2,transition:'width 0.5s ease'}}/></div>
                        </div>
                        <div style={{textAlign:'right'}}><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:G.accent}}>{tot.toLocaleString()}</div><div style={{fontSize:9,color:G.muted,letterSpacing:1}}>LIFETIME</div></div>
                        <div style={{textAlign:'right'}}><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:G.muted}}>{(rdsByFAYr[f.id]||0).toLocaleString()}</div><div style={{fontSize:9,color:G.dim,letterSpacing:1}}>{curYear()}</div></div>
                        <div style={{textAlign:'right'}}><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:(malByFA[f.id]||0)>0?G.danger:G.dim}}>{malByFA[f.id]||0}</div><div style={{fontSize:9,color:G.dim,letterSpacing:1}}>MAL</div></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* By Position */}
          {statSub==='positions' && (
            <div>
              <div style={stStyle}>ROUNDS BY FIRING POSITION</div>
              {lifeRds===0 && <div style={{textAlign:'center',padding:'34px 18px',color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>LOG SESSIONS WITH POSITIONS TO SEE DATA</div>}
              {lifeRds>0 && (
                <div style={cardStyle}>
                  <div style={{padding:13}}>
                    {[...POSITIONS.map(p=>p.v),'unspecified'].filter(pv=>rdsByPos[pv]>0).map(pv => {
                      const label=POSITIONS.find(p=>p.v===pv)?.l||'Unspecified';
                      const rds=rdsByPos[pv]||0, ses=sessByPos[pv]||0;
                      const pct=Math.round((rds/maxPosRds)*100), share=Math.round((rds/lifeRds)*100);
                      return (
                        <div key={pv} style={{padding:'11px 0',borderBottom:`1px solid ${G.border}`}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:5}}>
                            <div>
                              <span style={{fontFamily:"'Oswald',sans-serif",fontSize:13,letterSpacing:1,color:G.text}}>{label}</span>
                              <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.dim,marginLeft:7}}>{ses} session{ses!==1?'s':''}</span>
                            </div>
                            <div>
                              <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:13,color:G.accent}}>{rds.toLocaleString()}</span>
                              <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.dim,marginLeft:5}}>{share}%</span>
                            </div>
                          </div>
                          <div style={barWrap}><div style={{height:'100%',width:`${pct}%`,background:G.accent,borderRadius:2,transition:'width 0.5s ease'}}/></div>
                        </div>
                      );
                    })}
                    {Object.keys(rdsByPos).filter(p=>rdsByPos[p]>0).length===0 && <div style={{textAlign:'center',padding:18,color:G.dim,fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:2}}>NO POSITION DATA</div>}
                  </div>
                </div>
              )}
              {lifeRds>0 && Object.keys(rdsByPos).some(p=>rdsByPos[p]>0) && (
                <div>
                  <div style={{...stStyle,marginTop:16}}>POSITION SUMMARY</div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:9,marginBottom:18}}>
                    {[...POSITIONS.map(p=>p.v),'unspecified'].filter(pv=>rdsByPos[pv]>0).slice(0,6).map(pv => {
                      const label=POSITIONS.find(p=>p.v===pv)?.l||'Unspecified';
                      const rds=rdsByPos[pv]||0, share=Math.round((rds/lifeRds)*100);
                      return <div key={pv} style={scardStyle}><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:24,color:G.accent,lineHeight:1,marginBottom:4}}>{rds.toLocaleString()}</div><div style={{fontSize:9,letterSpacing:2,textTransform:'uppercase',color:G.muted,marginBottom:3}}>{label}</div><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:G.dim}}>{share}% of total</div></div>;
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Export */}
          {statSub==='export' && (
            <div>
              <div style={stStyle}>BACKUP & EXPORT</div>

              {/* Summary */}
              <div style={{...cardStyle, padding:'12px 14px', marginBottom:14}}>
                <div style={{fontSize:12, color:G.muted, marginBottom:10}}>Current data stored on this device:</div>
                <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:0}}>
                  {[
                    [firearms.length, 'Firearms'],
                    [suppressors.length, 'Suppressors'],
                    [sessions.length, 'Sessions'],
                  ].map(([n,l]) => (
                    <div key={l} style={{background:G.bg, borderRadius:1, padding:'9px 10px', textAlign:'center'}}>
                      <div style={{fontFamily:"'Share Tech Mono',monospace", fontSize:22, color:G.accent, lineHeight:1, marginBottom:3}}>{n}</div>
                      <div style={{fontSize:9, letterSpacing:2, textTransform:'uppercase', color:G.muted}}>{l}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* JSON Backup */}
              <div style={stStyle}>FULL BACKUP</div>
              <div style={{...cardStyle, padding:'14px'}}>
                <div style={{fontSize:13, color:G.text, fontWeight:600, marginBottom:4}}>JSON Backup</div>
                <div style={{fontSize:12, color:G.muted, marginBottom:12, lineHeight:1.6}}>
                  Exports all firearms, suppressors, sessions, PMCS schedules, and malfunction logs as a single JSON file. Use this to back up your data or transfer it to a new device.
                </div>
                <button style={{...btnP, width:'100%', textAlign:'center'}} onClick={exportJSON}>
                  ↓ Download Full Backup (.json)
                </button>
              </div>

              {/* CSV Exports */}
              <div style={stStyle}>SPREADSHEET EXPORT</div>
              <div style={{...cardStyle, padding:'14px', marginBottom:10}}>
                <div style={{fontSize:13, color:G.text, fontWeight:600, marginBottom:4}}>Sessions Log (CSV)</div>
                <div style={{fontSize:12, color:G.muted, marginBottom:12, lineHeight:1.6}}>
                  One row per firearm per session. Includes date, location, rounds, suppressor, ammo, position, score, malfunctions, and notes. Opens in Excel or Google Sheets.
                </div>
                <button style={{...btnG, width:'100%', textAlign:'center'}} onClick={exportCSV}>
                  ↓ Download Sessions CSV
                </button>
              </div>
              {suppressors.length > 0 && (
                <div style={{...cardStyle, padding:'14px', marginBottom:10}}>
                  <div style={{fontSize:13, color:G.text, fontWeight:600, marginBottom:4}}>Suppressors (CSV)</div>
                  <div style={{fontSize:12, color:G.muted, marginBottom:12, lineHeight:1.6}}>
                    Exports your suppressor registry with all NFA info, lifetime rounds, and notes.
                  </div>
                  <button style={{...btnG, width:'100%', textAlign:'center'}} onClick={exportSuppressorsCSV}>
                    ↓ Download Suppressors CSV
                  </button>
                </div>
              )}

              {/* Import */}
              <div style={stStyle}>RESTORE FROM BACKUP</div>
              <div style={{...cardStyle, padding:'14px'}}>
                <div style={{fontSize:13, color:G.text, fontWeight:600, marginBottom:4}}>Import JSON Backup</div>
                <div style={{fontSize:12, color:G.muted, marginBottom:4, lineHeight:1.6}}>
                  Restore a previously exported JSON backup. This replaces all current data on this device.
                </div>
                <div style={{fontSize:11, color:G.danger, marginBottom:12}}>
                  ⚠ Warning: importing will overwrite your existing data. Export a backup first if needed.
                </div>
                <label style={{...btnG, display:'block', textAlign:'center', cursor:'pointer', padding:'10px 15px', fontFamily:"'Oswald',sans-serif", fontSize:12, letterSpacing:2, textTransform:'uppercase', color:G.muted}}>
                  ↑ Choose Backup File (.json)
                  <input type="file" accept=".json,application/json" onChange={handleImport} style={{display:'none'}}/>
                </label>
                {importMsg && (
                  <div style={{marginTop:10, padding:'9px 12px', borderRadius:1, background:importMsg.ok?`${G.green}15`:`${G.danger}15`, border:`1px solid ${importMsg.ok?G.green+'44':G.danger+'44'}`, fontSize:12, color:importMsg.ok?G.green:G.danger}}>
                    {importMsg.ok ? '✓ ' : '✕ '}{importMsg.text}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Modals */}
      {showSess && <SessionModal firearms={firearms} suppressors={suppressors} existing={editSess} onSave={saveSess} onClose={()=>{setShowSess(false);setEditSess(null);}}/>}
      {showFA && <FirearmModal existing={editFA} onSave={saveFA} onClose={()=>{setShowFA(false);setEditFA(null);}}/>}
      {showSupp && <SuppressorModal existing={editSupp} onSave={saveSupp} onClose={()=>{setShowSupp(false);setEditSupp(null);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// Catch render errors and show them instead of blank screen
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Error: ' + msg + '\nLine ' + line + '\n' + (err ? err.stack : '');
  document.getElementById('root').style.display = 'none';
};
</script>
</body>
</html>
